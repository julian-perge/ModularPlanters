modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Julian Perge"
logoFile="logo.png"
description='''
Build Agritech: Evolved planters into one multiblock with shared power, fertilizer and outputs
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="agritechevolved"
    type="required"
    versionRange="[2.2.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[26.1.13-beta,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="appflux"
    type="optional"
    versionRange="[26.1-1.0.2-neoforge,)"
    ordering="NONE"
    side="BOTH"
